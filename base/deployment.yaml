apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-mcp
  namespace: searxng-mcp
  labels:
    app: searxng-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-mcp
  template:
    metadata:
      labels:
        app: searxng-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: searxng-mcp
        image: isokoliuk/mcp-searxng:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: SEARXNG_URL
          value: http://searxng.searxng.svc.cluster.local
        - name: MCP_HTTP_PORT
          value: "3000"
        - name: MCP_HTTP_HOST
          value: 0.0.0.0
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      hostNetwork: false
      hostPID: false
      volumes:
      - name: tmp
        emptyDir: {}
